services:
  web:
    build: ./app
    container_name: topp-nfs-web
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - PYTHONPATH=/service
    depends_on:
      - db
    volumes:
      - ./app_data/uploads:/service/app/static/uploads
    # Führt erst Init DB aus, dann startet es die App
    command: >
      sh -c "python -m app.init_db && 
             gunicorn -w 4 -b 0.0.0.0:5000 app:app"
    networks:
      - nfs-network

  db:
    image: postgres:15-alpine
    container_name: topp-nfs-db
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nfs-network

volumes:
  postgres_data:

networks:
  nfs-network:
    driver: bridge
