{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card p-4 shadow-sm">
            <h4 class="fw-bold mb-3">Passwort Reset</h4>
            <p class="text-muted small mb-4">Gib deine E-Mail ein. Wir senden dir einen Link.</p>
            <form method="POST">
                <div class="mb-4">
                    <input type="email" name="email" class="form-control form-control-lg bg-light border-0" placeholder="E-Mail Adresse" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill">Link senden</button>
            </form>
            <div class="mt-4 text-center">
                <a href="/login" class="text-muted small text-decoration-none">Zurück zum Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
