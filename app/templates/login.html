{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle mb-3" style="width: 80px; height: 80px;">
                <i class="bi bi-heart-pulse-fill text-danger" style="font-size: 40px;"></i>
            </div>
            
            <h4 class="fw-bold">Willkommen zurück</h4>
            <p class="text-muted small">Bitte logge dich ein, um fortzufahren.</p>
        </div>
        <div class="card p-4 shadow-sm border-0">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small text-muted">Benutzername</label>
                    <input type="text" name="username" class="form-control form-control-lg bg-light border-0" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Passwort</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light border-0" required>
                </div>
                
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberCheck" name="remember">
                    <label class="form-check-label small text-muted" for="rememberCheck">Angemeldet bleiben</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill shadow-sm">Einloggen</button>
            </form>
            <div class="mt-4 text-center">
                <a href="/forgot-password" class="text-muted small text-decoration-none">Passwort vergessen?</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
