<input type="hidden" name="shuffled_options" value='{{ options | tojson | forceescape }}'>
<div class="mc-grid">
    {% if feedback %}
        {% for opt in options %}
            {% if opt == card.answer %}
                <div class="btn-answer p-2 p-sm-3 rounded-4 w-100 shadow-sm" style="background-color: #198754 !important; border-color: #198754 !important; color: #ffffff !important;">
                    <span class="shortcut-badge" style="background: rgba(255,255,255,0.2);"><i class="bi bi-check-lg"></i></span><div>{{ opt | markdown }}</div>
                </div>
            {% elif opt == user_answer %}
                <div class="btn-answer p-2 p-sm-3 rounded-4 w-100 shadow-sm" style="background-color: #dc3545 !important; border-color: #dc3545 !important; color: #ffffff !important;">
                    <span class="shortcut-badge" style="background: rgba(255,255,255,0.2);"><i class="bi bi-x-lg"></i></span><div>{{ opt | markdown }}</div>
                </div>
            {% else %}
                <div class="btn-answer p-2 p-sm-3 rounded-4 w-100 bg-body-tertiary border-secondary border-opacity-25" style="color: var(--bs-body-color); opacity: 0.6;">
                    <span class="shortcut-badge">-</span><div>{{ opt | markdown }}</div>
                </div>
            {% endif %}
        {% endfor %}
    {% else %}
        {% for opt in options %}
            <button type="submit" name="mc_answer" value="{{ opt }}" class="btn btn-outline-primary btn-answer p-2 p-sm-3 rounded-4 w-100">
                <span class="shortcut-badge">{{ loop.index }}</span><div>{{ opt | markdown }}</div>
            </button>
        {% endfor %}
    {% endif %}
</div>
