{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card p-4 shadow-sm border-0">
            <h4 class="fw-bold mb-3 text-primary">Neues Passwort</h4>
            <form method="POST">
                <div class="mb-3">
                    <input type="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="Neues Passwort" required>
                </div>
                <div class="mb-4">
                    <input type="password" name="confirm" class="form-control form-control-lg bg-light border-0" placeholder="Bestätigen" required>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-lg rounded-pill">Speichern & Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
